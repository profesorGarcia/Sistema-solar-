<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi universo</title>
<style>
body{margin:0;background:#070b1c;color:white;font-family:Arial,sans-serif;text-align:center;padding:20px}
canvas{width:100%;max-width:500px;background:#0b1228;border-radius:16px}
input{width:80%;accent-color:#65c8ff}
</style>
</head>
<body>
<h1>🌌 Mi universo</h1>
<p>Explora la órbita de un planeta</p>
<canvas id="space" width="500" height="500"></canvas>
<p>Velocidad orbital</p>
<input id="speed" type="range" min="1" max="10" value="4">
<p id="readout">Velocidad: 4</p>
<script>
const c=document.getElementById("space");
const ctx=c.getContext("2d");
const slider=document.getElementById("speed");
let angle=0;
function draw(){
ctx.clearRect(0,0,500,500);
ctx.strokeStyle="#34476e";ctx.lineWidth=2;
ctx.beginPath();ctx.ellipse(250,250,160,100,0,0,Math.PI*2);ctx.stroke();
ctx.fillStyle="#ffd166";ctx.beginPath();ctx.arc(250,250,24,0,Math.PI*2);ctx.fill();
const x=250+160*Math.cos(angle);const y=250+100*Math.sin(angle);
ctx.fillStyle="#54c8ff";ctx.beginPath();ctx.arc(x,y,12,0,Math.PI*2);ctx.fill();
ctx.fillStyle="white";ctx.font="15px Arial";ctx.fillText("Sol",278,255);ctx.fillText("Planeta",x+15,y-12);
angle+=Number(slider.value)*0.003;
document.getElementById("readout").textContent="Velocidad: "+slider.value;
requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
